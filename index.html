    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
          if (window.Window && window.Window.prototype) {
            try {
              var desc = Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch');
              if (desc && !desc.set) {
                Object.defineProperty(window.Window.prototype, 'fetch', {
                  get: function() {
                    return customFetch;
                  },
                  set: function(fn) {
                    customFetch = fn;
                  },
                  configurable: true,
                  enumerable: true,
                });
              }
            } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
