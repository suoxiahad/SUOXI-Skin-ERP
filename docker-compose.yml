# Docker Compose definition for SUOXI Skin ERP Local Development (PostgreSQL + Redis)
# Dev-only credentials: must be replaced with strong secrets in production environments.

services:
  postgres:
    image: postgres:16-alpine
    container_name: suoxi_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: suoxi_crm
      POSTGRES_USER: suoxi_dev
      POSTGRES_PASSWORD: suoxi_dev_password_only
      TZ: Asia/Dhaka
    ports:
      - "5432:5432"
    volumes:
      - suoxi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suoxi_dev -d suoxi_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: suoxi_redis_dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - suoxi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  suoxi_postgres_data:
    driver: local
  suoxi_redis_data:
    driver: local
