# =============================================================================
# SUOXI Skin Care & Aesthetic Center ERP — LiteSpeed / OpenLiteSpeed Reverse Proxy
# Domain: erp.suoxi.tech
#
# NOTES:
#  1. Replace `127.0.0.1:3100` below with the exact PORT configured in `.env`
#     after checking free ports on the VPS via `ss -tulpn`.
#  2. LiteSpeed Web Server Enterprise (CyberPanel / DirectAdmin) supports
#     Apache-compatible ProxyPass rules inside vhost include or `.htaccess`
#     paired with an External App (`suoxi_erp_backend`).
#  3. NEVER expose `/var/data/suoxi/uploads` directly in the document root;
#     private clinical files are streamed only through `/api/v1/files/*`.
# =============================================================================

# --- OpenLiteSpeed vhost.conf snippet (WebAdmin -> Virtual Hosts -> erp.suoxi.tech) ---
#
# extprocessor suoxi_erp_backend {
#   type                    proxy
#   address                 127.0.0.1:3100
#   maxConns                200
#   pcKeepAliveTimeout      60
#   initTimeout             60
#   retryTimeout            0
#   respBuffer              0
# }
#
# context / {
#   type                    proxy
#   handler                 suoxi_erp_backend
#   addDefaultCharset       off
#   extraHeaders            <<<END_extraHeaders
#     Strict-Transport-Security "max-age=31536000; includeSubDomains"
#     X-Content-Type-Options "nosniff"
#     X-Frame-Options "DENY"
#     Referrer-Policy "strict-origin-when-cross-origin"
#   END_extraHeaders
# }
#
# rewrite {
#   enable                  1
#   autoLoadHtaccess        1
#   rules                   <<<END_rules
#     RewriteEngine On
#     RewriteCond %{HTTPS} !=on
#     RewriteRule ^(.*)$ https://erp.suoxi.tech/$1 [R=301,L]
#   END_rules
# }

# --- LiteSpeed Enterprise (LSWS) vhost include / Apache-style ProxyPass ---
# Place inside CyberPanel vhost config (vHost Conf) for erp.suoxi.tech:
#
#   RewriteEngine On
#   RewriteCond %{HTTPS} !=on
#   RewriteRule ^(.*)$ https://erp.suoxi.tech/$1 [R=301,L]
#
#   # Forward all requests to the PM2 Node.js Express backend via External App
#   RewriteRule ^(.*)$ HTTP://suoxi_erp_backend/$1 [P,L]
#
# Ensure LiteSpeed passes client IP & HTTPS headers so Express `trust proxy`
# sets `Secure` session cookies properly:
#   X-Forwarded-Proto: https
#   X-Forwarded-For:   <client_ip>
#   Host:              erp.suoxi.tech
#
# Health check endpoints for uptime probes:
#   GET https://erp.suoxi.tech/healthz
#   GET https://erp.suoxi.tech/readyz
