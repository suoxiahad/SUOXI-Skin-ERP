# =============================================================================
# SUOXI Skin Care & Aesthetic Center CRM — Nginx Production Reverse Proxy
# Copy to: /etc/nginx/sites-available/suoxi-crm
# Enable:  sudo ln -s /etc/nginx/sites-available/suoxi-crm /etc/nginx/sites-enabled/
# SSL:     sudo certbot --nginx -d crm.suoxiclinic.com
# =============================================================================

upstream suoxi_crm_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.suoxiclinic.com;

    # Allow Let's Encrypt HTTP-01 challenge before HTTPS redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.suoxiclinic.com;

    # Managed by Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/crm.suoxiclinic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.suoxiclinic.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow clinical photos & PDF documents up to 20 MB (app enforces 15 MB per file)
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Never expose hidden dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Long-term cache for Vite content-hashed static assets
    location /assets/ {
        proxy_pass http://suoxi_crm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API & Authenticated Private File Streaming (never publicly cached)
    location /api/ {
        proxy_pass http://suoxi_crm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Frontend SPA & Patient Portal
    location / {
        proxy_pass http://suoxi_crm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
